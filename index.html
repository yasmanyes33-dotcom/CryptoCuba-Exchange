<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f1419; color: #fff; padding: 20px; }
    #dbg { background: #c00; padding: 10px; margin-bottom: 15px; font-size: 12px; word-break: break-all; }
    button {
      display: block; width: 100%; padding: 16px; margin: 10px 0;
      font-size: 15px; font-weight: 700; border: none; border-radius: 12px;
      cursor: pointer; color: #1a1208;
    }
    .b1 { background: #ffb547; }
    .b2 { background: #4ade80; }
    .b3 { background: #60a5fa; }
  </style>
</head>
<body>
  <div id="dbg">Esperando test...</div>

  <h2>Test de envío</h2>
  <p style="font-size:13px;color:#8b97a5;">Prueba cada botón y dime cuál funciona.</p>

  <button class="b1" onclick="test1()">1️⃣ openTelegramLink</button>
  <button class="b2" onclick="test2()">2️⃣ location.href (link normal)</button>
  <button class="b3" onclick="test3()">3️⃣ window.open (_blank)</button>

  <div id="result" style="margin-top:20px;padding:10px;background:#1a2028;border-radius:10px;font-size:13px;"></div>

<script>
  var tg = null;
  if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    try { tg.ready(); tg.expand(); } catch(e) {}
  }

  var botUrl = 'https://t.me/Atsab_bot?text=' + encodeURIComponent('TEST_RESERVA_123');
  var dbg = document.getElementById('dbg');
  var res = document.getElementById('result');

  dbg.textContent = 'tg:' + (tg ? 'OK' : 'NULL') + ' | v:' + (tg ? tg.version : '?');

  function log(msg) {
    res.innerHTML += '<div>• ' + msg + '</div>';
  }

  function test1() {
    res.innerHTML = '';
    log('Probando openTelegramLink...');
    try {
      tg.openTelegramLink(botUrl);
      log('openTelegramLink llamado sin error');
      dbg.style.background = '#0a0';
      dbg.textContent = 'openTelegramLink llamado';
    } catch(e) {
      log('ERROR: ' + e.message);
    }
  }

  function test2() {
    res.innerHTML = '';
    log('Probando location.href...');
    try {
      window.location.href = botUrl;
      log('location.href asignado sin error');
      dbg.style.background = '#0a0';
      dbg.textContent = 'location.href asignado';
    } catch(e) {
      log('ERROR: ' + e.message);
    }
  }

  function test3() {
    res.innerHTML = '';
    log('Probando window.open...');
    try {
      var w = window.open(botUrl, '_blank');
      log('window.open devolvió: ' + (w ? 'ventana' : 'null/bloqueado'));
      dbg.style.background = '#0a0';
      dbg.textContent = 'window.open llamado';
    } catch(e) {
      log('ERROR: ' + e.message);
    }
  }
</script>
</body>
</html>
